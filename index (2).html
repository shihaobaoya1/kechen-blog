<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>手记 · 一个博客</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Noto+Serif+SC:wght@400;600;700&family=Inter:wght@400;500&family=Noto+Sans+SC:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FAF8F3;
    --paper-dim:#F1EDE3;
    --ink:#20201C;
    --ink-soft:#5A574C;
    --moss:#4A5D45;
    --rust:#8B4A3A;
    --gold:#B8922E;
    --line:#DEDACD;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter','Noto Sans SC',sans-serif;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit; text-decoration:none;}

  /* ---------- Header ---------- */
  header{
    padding:56px 8vw 32px;
    border-bottom:1px solid var(--line);
  }
  .site-title{
    font-family:'Fraunces','Noto Serif SC',serif;
    font-weight:700;
    font-size:clamp(2.2rem, 5vw, 3.4rem);
    letter-spacing:-0.01em;
  }
  .site-tagline{
    margin-top:10px;
    color:var(--ink-soft);
    font-size:1rem;
    max-width:520px;
  }
  nav{
    margin-top:28px;
    display:flex;
    gap:28px;
    font-family:'IBM Plex Mono',monospace;
    font-size:0.82rem;
    letter-spacing:0.04em;
    text-transform:uppercase;
  }
  nav a{
    color:var(--ink-soft);
    padding-bottom:4px;
    border-bottom:2px solid transparent;
    cursor:pointer;
  }
  nav a.active, nav a:hover{
    color:var(--ink);
    border-bottom-color:var(--moss);
  }

  /* ---------- Layout ---------- */
  .wrap{
    display:grid;
    grid-template-columns:120px 1fr;
    max-width:1100px;
    margin:0 auto;
    padding:48px 8vw 100px;
    gap:40px;
  }
  @media (max-width:760px){
    .wrap{grid-template-columns:1fr; padding:32px 6vw 80px;}
    .spine{display:none;}
  }

  /* ---------- Spine (signature element: dated timeline rule) ---------- */
  .spine{
    position:relative;
    border-left:1px solid var(--line);
    padding-left:0;
  }
  .spine .year{
    font-family:'IBM Plex Mono',monospace;
    font-size:0.78rem;
    color:var(--ink-soft);
    position:sticky;
    top:40px;
  }
  .spine .tick{
    position:relative;
    margin:0 0 0 -1px;
    padding:0 0 40px 18px;
    border-left:2px solid var(--moss);
  }
  .spine .tick::before{
    content:'';
    position:absolute;
    left:-6px; top:2px;
    width:10px; height:10px;
    border-radius:50%;
    background:var(--paper);
    border:2px solid var(--moss);
  }
  .spine .tick .date{
    font-family:'IBM Plex Mono',monospace;
    font-size:0.72rem;
    color:var(--ink-soft);
  }

  /* ---------- Post list ---------- */
  .entries{
    display:flex;
    flex-direction:column;
    gap:0;
  }
  .entry{
    padding:32px 0;
    border-bottom:1px solid var(--line);
    cursor:pointer;
  }
  .entry:first-child{padding-top:0;}
  .entry .meta{
    font-family:'IBM Plex Mono',monospace;
    font-size:0.75rem;
    color:var(--moss);
    text-transform:uppercase;
    letter-spacing:0.05em;
    margin-bottom:10px;
  }
  .entry h2{
    font-family:'Fraunces','Noto Serif SC',serif;
    font-weight:600;
    font-size:1.6rem;
    margin-bottom:10px;
    transition:color .15s ease;
  }
  .entry:hover h2{color:var(--rust);}
  .entry p{
    color:var(--ink-soft);
    font-size:0.98rem;
    max-width:640px;
  }
  .entry .read-more{
    display:inline-block;
    margin-top:12px;
    font-family:'IBM Plex Mono',monospace;
    font-size:0.78rem;
    color:var(--ink);
    border-bottom:1px solid var(--gold);
  }

  /* ---------- Single post view ---------- */
  .post-view{display:none;}
  .post-view.active{display:block;}
  .list-view.hidden{display:none;}
  .back-link{
    font-family:'IBM Plex Mono',monospace;
    font-size:0.78rem;
    color:var(--ink-soft);
    cursor:pointer;
    display:inline-block;
    margin-bottom:28px;
  }
  .back-link:hover{color:var(--moss);}
  .post-view .meta{
    font-family:'IBM Plex Mono',monospace;
    font-size:0.78rem;
    color:var(--moss);
    text-transform:uppercase;
    letter-spacing:0.05em;
    margin-bottom:14px;
  }
  .post-view h1{
    font-family:'Fraunces','Noto Serif SC',serif;
    font-weight:700;
    font-size:clamp(1.8rem,4vw,2.6rem);
    margin-bottom:24px;
    max-width:720px;
  }
  .post-view .body{
    max-width:680px;
    font-size:1.05rem;
    color:var(--ink);
  }
  .post-view .body p{margin-bottom:20px;}
  .post-view .body blockquote{
    border-left:3px solid var(--gold);
    padding-left:20px;
    margin:24px 0;
    color:var(--ink-soft);
    font-style:italic;
  }

  /* ---------- Comments ---------- */
  .comments-section{
    max-width:680px;
    margin-top:56px;
    padding-top:32px;
    border-top:1px solid var(--line);
  }
  .comments-title{
    font-family:'Fraunces','Noto Serif SC',serif;
    font-weight:600;
    font-size:1.2rem;
    margin-bottom:20px;
  }
  .comment-login-prompt{
    font-family:'Inter','Noto Sans SC',sans-serif;
    font-size:0.9rem;
    color:var(--ink-soft);
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:24px;
  }
  .signin-btn.small{
    padding:6px 14px;
    font-size:0.78rem;
  }
  .comment-form{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-bottom:28px;
  }
  .comment-form textarea{
    font-family:'Inter','Noto Sans SC',sans-serif;
    font-size:0.92rem;
    padding:12px 14px;
    border:1px solid var(--line);
    border-radius:8px;
    background:var(--paper-dim);
    color:var(--ink);
    resize:vertical;
  }
  .comment-form button{
    align-self:flex-end;
    font-family:'Inter','Noto Sans SC',sans-serif;
    font-size:0.85rem;
    background:var(--moss);
    color:var(--paper);
    border:none;
    border-radius:999px;
    padding:9px 20px;
    cursor:pointer;
  }
  .comments-list{
    display:flex;
    flex-direction:column;
    gap:20px;
  }
  .comment-item{
    display:flex;
    gap:12px;
  }
  .comment-item img{
    width:32px; height:32px;
    border-radius:50%;
    flex-shrink:0;
  }
  .comment-item .who{
    font-family:'IBM Plex Mono',monospace;
    font-size:0.78rem;
    color:var(--moss);
    margin-bottom:4px;
  }
  .comment-item .text{
    font-size:0.92rem;
    color:var(--ink);
  }
  .comments-empty{
    color:var(--ink-soft);
    font-size:0.88rem;
  }

  /* ---------- Footer (dark, multi-column) ---------- */
  footer{
    background:var(--ink);
    color:#B9B7AE;
    margin-top:60px;
  }
  .footer-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:16px;
    padding:36px 8vw 32px;
  }
  .footer-cta{
    font-family:'Inter','Noto Sans SC',sans-serif;
    font-size:0.9rem;
    color:var(--ink);
    background:var(--paper);
    border:none;
    border-radius:999px;
    padding:12px 24px;
    cursor:pointer;
  }
  .footer-lang{
    font-family:'Inter','Noto Sans SC',sans-serif;
    font-size:0.85rem;
    color:#B9B7AE;
    border:1px solid #45443C;
    border-radius:999px;
    padding:10px 18px;
    cursor:pointer;
    background:transparent;
  }
  .footer-cols{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:32px;
    padding:0 8vw 40px;
    max-width:1100px;
    margin:0 auto;
  }
  @media (max-width:760px){
    .footer-cols{grid-template-columns:repeat(2,1fr);}
  }
  .footer-cols h4{
    font-family:'Fraunces','Noto Serif SC',serif;
    font-weight:600;
    font-size:0.95rem;
    color:var(--paper);
    margin-bottom:16px;
  }
  .footer-cols a{
    display:block;
    font-size:0.85rem;
    color:#B9B7AE;
    padding:7px 0;
    cursor:pointer;
  }
  .footer-cols a:hover{color:var(--paper);}
  .back-to-top{
    text-align:center;
    padding:20px 0 32px;
    border-top:1px solid #33322B;
  }
  .back-to-top a{
    font-family:'IBM Plex Mono',monospace;
    font-size:0.8rem;
    color:#B9B7AE;
    cursor:pointer;
  }
  .back-to-top a:hover{color:var(--paper);}
  .footer-bottom{
    border-top:1px solid #33322B;
    padding:22px 8vw 30px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:16px;
    font-size:0.8rem;
  }
  .footer-bottom .legal{
    max-width:640px;
    color:#8C8A80;
    line-height:1.7;
  }
  .footer-social{
    display:flex;
    gap:18px;
  }
  .footer-social a{
    color:#B9B7AE;
    font-family:'IBM Plex Mono',monospace;
    font-size:0.9rem;
    cursor:pointer;
  }
  .footer-social a:hover{color:var(--paper);}

  /* ---------- Auth ---------- */
  .auth-area{
    display:flex;
    align-items:center;
    gap:14px;
  }
  .signin-btn{
    font-family:'Inter','Noto Sans SC',sans-serif;
    font-size:0.82rem;
    color:var(--ink);
    background:var(--paper);
    border:1px solid var(--ink);
    border-radius:999px;
    padding:9px 18px;
    cursor:pointer;
  }
  .signin-btn:hover{
    background:var(--ink);
    color:var(--paper);
  }
  .user-chip{
    display:none;
    align-items:center;
    gap:10px;
    font-family:'IBM Plex Mono',monospace;
    font-size:0.8rem;
    color:var(--ink-soft);
  }
  .user-chip img{
    width:28px; height:28px;
    border-radius:50%;
    border:1px solid var(--line);
  }
  .user-chip .logout{
    cursor:pointer;
    color:var(--rust);
    border-bottom:1px solid var(--rust);
  }
</style>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
</head>
<body>

<header>
  <div class="site-title">手记</div>
  <div class="site-tagline">一些关于阅读、思考与生活片段的记录。不定期更新。</div>
  <nav>
    <a class="active">全部文章</a>
    <a>关于</a>
  </nav>

  <div class="auth-area">
    <button class="signin-btn" id="signinBtn" onclick="signInWithGoogle()">使用 Google 登录</button>
    <div class="user-chip" id="userChip">
      <img id="userAvatar" src="" alt="">
      <span id="userName"></span>
      <span class="logout" onclick="handleLogout()">退出</span>
    </div>
  </div>
</header>

<div class="wrap">
  <div class="spine" id="spine"></div>

  <main>
    <div class="list-view" id="listView">
      <div class="entries" id="entries"></div>
    </div>

    <div class="post-view" id="postView">
      <div class="back-link" onclick="showList()">← 返回全部文章</div>
      <div class="meta" id="postMeta"></div>
      <h1 id="postTitle"></h1>
      <div class="body" id="postBody"></div>

      <div class="comments-section">
        <h3 class="comments-title">评论</h3>

        <div id="commentLoginPrompt" class="comment-login-prompt">
          登录后可以发表评论 ——
          <button class="signin-btn small" onclick="signInWithGoogle()">使用 Google 登录</button>
        </div>

        <form id="commentForm" class="comment-form" style="display:none;" onsubmit="submitComment(event)">
          <textarea id="commentInput" placeholder="写下你的想法…" rows="3" required></textarea>
          <button type="submit">发表评论</button>
        </form>

        <div id="commentsList" class="comments-list"></div>
      </div>
    </div>
  </main>
</div>

<footer>
  <div class="footer-top">
    <button class="footer-cta">订阅更新</button>
    <button class="footer-lang">🌐 简体中文 ⌄</button>
  </div>

  <div class="footer-cols">
    <div>
      <h4>浏览</h4>
      <a onclick="showList()">全部文章</a>
      <a>随笔</a>
      <a>阅读</a>
      <a>生活</a>
    </div>
    <div>
      <h4>关于</h4>
      <a>关于这个博客</a>
      <a>写作理念</a>
      <a>常见问题</a>
      <a>联系方式</a>
    </div>
    <div>
      <h4>资源</h4>
      <a>推荐书单</a>
      <a>友情链接</a>
      <a>订阅 RSS</a>
      <a>归档</a>
    </div>
    <div>
      <h4>更多</h4>
      <a>隐私说明</a>
      <a>转载须知</a>
      <a>更新日志</a>
    </div>
  </div>

  <div class="back-to-top">
    <a onclick="window.scrollTo({top:0,behavior:'smooth'})">↑ 回到页首</a>
  </div>

  <div class="footer-bottom">
    <div class="legal">本站内容为个人创作,转载请注明出处。© 2026 手记。保留所有权利。</div>
    <div class="footer-social">
      <a title="X">𝕏</a>
      <a title="Instagram">◎</a>
      <a title="RSS">⟆</a>
      <a title="Email">✉</a>
    </div>
  </div>
</footer>

<script>
// ===== Firebase 配置 =====
// 把下面这几行换成你自己在 Firebase 控制台 项目设置 里拿到的配置
const firebaseConfig = {
  apiKey: "在这里粘贴你的apiKey",
  authDomain: "你的项目id.firebaseapp.com",
  projectId: "你的项目id",
  storageBucket: "你的项目id.appspot.com",
  messagingSenderId: "你的messagingSenderId",
  appId: "你的appId"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
const googleProvider = new firebase.auth.GoogleAuthProvider();

let currentUser = null;
let currentPostId = null;

function signInWithGoogle(){
  auth.signInWithPopup(googleProvider).catch(err => {
    console.error(err);
    alert('登录失败,请稍后再试。');
  });
}

function handleLogout(){
  auth.signOut();
}

auth.onAuthStateChanged(user => {
  currentUser = user;
  const signinBtn = document.getElementById('signinBtn');
  const userChip = document.getElementById('userChip');
  const loginPrompt = document.getElementById('commentLoginPrompt');
  const commentForm = document.getElementById('commentForm');

  if (user){
    signinBtn.style.display = 'none';
    userChip.style.display = 'flex';
    document.getElementById('userAvatar').src = user.photoURL || '';
    document.getElementById('userName').textContent = user.displayName || user.email;
    loginPrompt.style.display = 'none';
    commentForm.style.display = 'flex';
  } else {
    signinBtn.style.display = 'inline-block';
    userChip.style.display = 'none';
    loginPrompt.style.display = 'flex';
    commentForm.style.display = 'none';
  }
});

// ===== 评论功能(Firestore) =====
function loadComments(postId){
  const listEl = document.getElementById('commentsList');
  listEl.innerHTML = '加载中…';

  db.collection('comments')
    .where('postId', '==', postId)
    .orderBy('createdAt', 'desc')
    .onSnapshot(snapshot => {
      if (snapshot.empty){
        listEl.innerHTML = '<div class="comments-empty">还没有评论,来说第一句话吧。</div>';
        return;
      }
      listEl.innerHTML = '';
      snapshot.forEach(doc => {
        const c = doc.data();
        const item = document.createElement('div');
        item.className = 'comment-item';
        item.innerHTML = `
          <img src="${c.avatar || ''}" alt="">
          <div>
            <div class="who">${c.name}</div>
            <div class="text">${c.text}</div>
          </div>
        `;
        listEl.appendChild(item);
      });
    }, err => {
      console.error(err);
      listEl.innerHTML = '<div class="comments-empty">评论加载失败,请检查 Firebase 配置。</div>';
    });
}

function submitComment(e){
  e.preventDefault();
  if (!currentUser) return;
  const input = document.getElementById('commentInput');
  const text = input.value.trim();
  if (!text) return;

  db.collection('comments').add({
    postId: currentPostId,
    text: text,
    name: currentUser.displayName || currentUser.email,
    avatar: currentUser.photoURL || '',
    uid: currentUser.uid,
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  }).then(() => {
    input.value = '';
  }).catch(err => {
    console.error(err);
    alert('评论发送失败,请稍后再试。');
  });
}

const posts = [
  {
    id: 1,
    date: "2026-08-12",
    tag: "随笔",
    title: "在早晨的第一杯茶里想一些无关紧要的事",
    excerpt: "有些想法只有在没有目的的时候才会出现。今天想聊聊为什么"无所事事"其实是一种被低估的生产力。",
    body: `<p>有些想法只有在没有目的的时候才会出现。今天想聊聊为什么"无所事事"其实是一种被低估的生产力。</p>
    <p>我们习惯把时间切成一个个任务,每一段都要有产出。但真正让人豁然开朗的念头,往往是在洗碗、走路、发呆的时候冒出来的。大脑需要空白,就像纸需要留白一样。</p>
    <blockquote>创造力不是被安排出来的,而是在缝隙里生长出来的。</blockquote>
    <p>所以偶尔允许自己浪费一点时间,可能不是懒惰,而是一种必要的呼吸。</p>`
  },
  {
    id: 2,
    date: "2026-07-29",
    tag: "阅读",
    title: "重读一本旧书,像是和过去的自己对话",
    excerpt: "同一段文字,五年前划的重点和今天想划的重点完全不同——这大概就是重读的意义。",
    body: `<p>同一段文字,五年前划的重点和今天想划的重点完全不同——这大概就是重读的意义。</p>
    <p>书没有变,变的是拿着书的人。重读不是重复,而是用现在的眼睛去看当年读不懂的部分,也是一次悄悄的自我检查:我在这几年里,到底变成了什么样子。</p>
    <p>下次如果不知道读什么,不妨从书架上抽一本读过的旧书。</p>`
  },
  {
    id: 3,
    date: "2026-07-03",
    tag: "生活",
    title: "关于慢下来这件事,我想得比较慢",
    excerpt: "越是想快点学会"慢生活",越是学不会。也许慢下来本身就不该是一个目标。",
    body: `<p>越是想快点学会"慢生活",越是学不会。也许慢下来本身就不该是一个目标,而是一种副作用——当你真正在意某件事的时候,自然会慢下来。</p>
    <p>比如认真切一次菜,认真读一页书,认真回一条消息。慢不是速度问题,是注意力问题。</p>`
  }
];

function renderList(){
  const entriesEl = document.getElementById('entries');
  const spineEl = document.getElementById('spine');
  entriesEl.innerHTML = '';
  spineEl.innerHTML = '<div class="year">2026</div>';

  posts.forEach(post => {
    const entry = document.createElement('div');
    entry.className = 'entry';
    entry.onclick = () => showPost(post.id);
    entry.innerHTML = `
      <div class="meta">${post.date} · ${post.tag}</div>
      <h2>${post.title}</h2>
      <p>${post.excerpt}</p>
      <span class="read-more">继续阅读 →</span>
    `;
    entriesEl.appendChild(entry);

    const tick = document.createElement('div');
    tick.className = 'tick';
    tick.innerHTML = `<div class="date">${post.date.slice(5)}</div>`;
    spineEl.appendChild(tick);
  });
}

function showPost(id){
  const post = posts.find(p => p.id === id);
  currentPostId = id;
  document.getElementById('postMeta').textContent = post.date + ' · ' + post.tag;
  document.getElementById('postTitle').textContent = post.title;
  document.getElementById('postBody').innerHTML = post.body;
  document.getElementById('listView').classList.add('hidden');
  document.getElementById('postView').classList.add('active');
  loadComments(id);
  window.scrollTo(0,0);
}

function showList(){
  document.getElementById('listView').classList.remove('hidden');
  document.getElementById('postView').classList.remove('active');
  window.scrollTo(0,0);
}

renderList();
</script>

</body>
</html>
